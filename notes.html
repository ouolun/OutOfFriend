<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14161F">
<title>OUT OF FRIENDS! Notes</title>
<style>
/* Layout system — 4px base grid: spacing 4/8/12/16/24; radius 8/12 and 28 for containers (12 inner + 16 padding, so corners stay concentric); control height 48 (min target 44);
   type scale 12/14/16/20 + display; one surface step per layer (bg → sf → sf2). Fonts: the device's UI font. */
:root{--bg:#14161F;--fg:#F6F4EE;--ac:#FF5A36;--late:#FF4A3D;
--sf:color-mix(in srgb,var(--fg) 7%,var(--bg));--sf2:color-mix(in srgb,var(--fg) 13%,var(--bg));
--ln:color-mix(in srgb,var(--fg) 14%,var(--bg));--mu:color-mix(in srgb,var(--fg) 55%,var(--bg));--acfg:var(--bg);--ui:var(--fg);--act:var(--ac);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r1:8px;--r2:12px;--r3:28px;--h:48px;
--t1:12px;--t2:14px;--t3:16px;--t4:20px;--fs:22px;
--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
button,.sw{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;padding:0 var(--s3);font:600 var(--t3)/1 var(--font);border:1px solid var(--ln);border-radius:var(--r2);background:var(--sf2);color:var(--ui);height:44px;min-width:44px;touch-action:manipulation;cursor:pointer}
button[aria-pressed=true],button[aria-checked=true],button[aria-expanded=true]{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:active{filter:brightness(1.15)}button:disabled{opacity:.35;cursor:default}
:focus{outline:none}:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.pri{}
/* header: thumbnail | page | timer */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s4);padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s4);background:var(--sf);border-bottom:1px solid var(--ln)}
#img,#rdy{width:min(28vw,144px);aspect-ratio:16/9;border-radius:var(--r1)}
#img{display:block;background:#000;object-fit:cover}
#rdy{background:var(--bg);border:1px solid var(--ln);display:none;align-items:center;justify-content:center;font-weight:800;font-size:var(--t4);color:var(--act)}
.num{font-weight:800;font-size:clamp(32px,10vw,48px);line-height:1;color:var(--act);font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{font-size:var(--t2);font-weight:600;color:var(--mu);margin-left:var(--s1)}
.num i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--act);vertical-align:top;margin-left:2px}
#tm{flex-direction:column;align-items:flex-end;gap:var(--s1);padding:0;background:none;border:0;height:auto;color:inherit;border-radius:var(--r1)}
#elw{display:flex;align-items:center;gap:var(--s1);color:var(--ui)}
#elw svg{display:none}
#tm.late #elw{color:var(--late)}
#tm.paused #elw{opacity:.45}
#el{font-weight:800;font-size:clamp(24px,7.5vw,32px);line-height:1;font-variant-numeric:tabular-nums}
#tgw{display:flex;align-items:center;gap:var(--s1);color:var(--mu);font-size:var(--t2);font-weight:600;font-variant-numeric:tabular-nums}
#tgw svg{width:14px;height:14px}
/* notes */
#wrap{flex:1;position:relative;min-height:0;display:flex}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4)}
#txt{white-space:pre-wrap;line-height:1.75;font-size:var(--fs)}
#txt.bold,#ed.bold{font-weight:700}
#txt .k{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.12em;background:var(--ac);color:var(--acfg);border-radius:6px;width:1.35em;height:1.2em;margin-right:.25em}
#txt .k svg{width:.85em;height:.85em;stroke-width:2.6}
#txt .d{color:var(--mu)}
#ed{display:none;width:100%;min-height:50vh;resize:none;border:1px dashed var(--ln);border-radius:var(--r2);background:transparent;color:var(--fg);font:inherit;font-size:var(--fs);line-height:1.75;padding:var(--s2) var(--s3);outline:none;overflow:hidden}
#ed:focus{border-color:var(--act)}
body.edit #txt{display:none}body.edit #ed{display:block}
#more{position:absolute;left:0;right:0;bottom:0;height:auto;border:0;padding:var(--s5) 0 var(--s2);border-radius:0;flex-direction:column;gap:2px;font-size:var(--t1);color:var(--act);background:linear-gradient(to bottom,transparent,var(--bg) 55%);opacity:0;transition:opacity .2s;pointer-events:none}
#more.show{opacity:1;pointer-events:auto}
/* edit toolbar */
#ebar{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);align-items:center;padding:var(--s4);background:var(--sf);border-top:1px solid var(--ln)}
body.edit #ebar{display:grid}
#ebar button{height:44px;padding:0 var(--s2);font-size:var(--t2);min-width:0}#ebar button span{overflow:hidden;text-overflow:ellipsis}
#ebar .fl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);color:var(--mu);font-size:var(--t2);font-weight:600;white-space:nowrap}
#et{width:88px;height:44px;border-radius:var(--r2);border:1px solid var(--ln);background:var(--sf2);color:var(--ui);font:700 var(--t3) var(--font);text-align:center;font-variant-numeric:tabular-nums}
/* footer: prev | settings | next */
footer{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s2);padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--ln)}
footer>.nav{height:48px}
#gear{width:48px;height:48px;padding:0}
/* settings sheet — one rhythm: 16px padding, 12px between rows, no dividers */
#panel{position:absolute;left:var(--s4);right:var(--s4);bottom:calc(100% + var(--s4));max-height:min(72vh,560px);overflow-y:auto;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);padding:var(--s4);box-shadow:0 12px 32px rgba(0,0,0,.35);display:none;flex-direction:column;gap:var(--s2);z-index:5}
#panel.open{display:flex}
.pr{display:flex;flex-direction:column;gap:var(--s2)}
.pr+.pr,.pr+#rst{margin-top:0}
.pr>.lb{display:flex;align-items:center;gap:var(--s2);font-size:var(--t2);font-weight:600;color:var(--mu)}
.pr>.lb svg{width:18px;height:18px}
.ctl{display:grid;grid-template-columns:44px 1fr 44px 44px;gap:var(--s2);align-items:center}
.ctl button{padding:0}
#fsv{height:44px;display:flex;align-items:center;justify-content:center;gap:var(--s2);border-radius:var(--r2);background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ui)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tile{height:60px;flex-direction:column;gap:var(--s1);font-size:var(--t2);padding:0 var(--s1)}
.tile span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sw{position:relative;overflow:hidden}
.sw .dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--ln);flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.sw:focus-within{outline:3px solid var(--act);outline-offset:2px}
#rst{width:100%;background:transparent;color:var(--mu);font-size:var(--t2)}
/* sub page (import / export) — full screen, back instead of close */
#modal{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#modal.open{display:flex}
#mhead{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:var(--s4);padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s4);background:var(--sf);border-bottom:1px solid var(--ln)}
#mt{display:flex;align-items:center;gap:var(--s2);font-size:var(--t4);font-weight:700;color:var(--ui)}
#mbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom))}
#mp{font-size:var(--t2);color:var(--mu);line-height:1.55;padding-bottom:var(--s2)}
#mtx{flex:1;min-height:0;width:100%;border:1px solid var(--ln);border-radius:var(--r2);background:var(--sf);color:var(--fg);font:var(--t2)/1.6 ui-monospace,Menlo,monospace;padding:var(--s3);resize:none}
#mbtn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}#mbtn .wide{grid-column:1/-1}#mbtn button{padding:0 var(--s2);min-width:0}#mbtn button span{overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ui);color:var(--bg);font-size:var(--t2);font-weight:700;padding:var(--s2) var(--s4);border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;display:flex;align-items:center;gap:var(--s2)}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){button,.sw,#et{border:2px solid ButtonText}}
</style></head><body>

 <div><img id="img" alt=""><div id="rdy" role="img">Ready</div></div>

<div id="wrap"><main id="main"><div id="txt"></div><textarea id="ed" spellcheck="false"></textarea></main><button id="more"></button></div>
<div id="ebar" role="toolbar"><button id="ins"></button><button id="par"></button><button id="rv"></button><button id="eDone"></button><label class="fl" for="et"><span id="fli"></span><input id="et" inputmode="numeric" placeholder="0:00"></label></div>

  <label class="sw tile"><span class="dot" id="dAc"></span><span id="sAc"></span><input type="color" id="cAc"></label></div></div>
 <div class="pr"><div class="tiles"><button class="tile" id="edt" aria-pressed="false"></button><button class="tile" id="imp"></button><button class="tile" id="exp"></button></div></div>
 <button id="rst"></button>
</div>
<button class="nav pri" id="prev"></button>
<button id="gear" aria-expanded="false" aria-controls="panel"></button>
<button class="nav pri" id="next"></button>
</footer>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div id="mhead"><button id="mback"></button><h2 id="mt"></h2></div><div id="mbox"><p id="mp"></p><textarea id="mtx" spellcheck="false"></textarea><div id="mbtn"></div></div></div>

/* pick the device language: Traditional vs Simplified Chinese by region/script, else base language, else English */
const lang=(()=>{for(const raw of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'])){const l=raw.toLowerCase();
 if(l.startsWith('zh'))return /hant|tw|hk|mo/.test(l)?'zh-Hant':'zh-Hans';const b=l.split('-')[0];if(L[b])return b}return 'en'})();
const tr=(k,o={})=>(L[lang][k]??L.en[k]).replace(/\{(\w+)\}/g,(_,x)=>o[x]);

let i=LS.get('oof_pg',0),fs=LS.get('oof_fs',22),bold=LS.get('oof_bd',false),col={...DEF,...LS.get('oof_col',{})},E=LS.get('oof_edits',{})||{},edit=false,t0=null,acc=0,run=false,wasLate=false;
{const st=LS.get('oof_tm',null);if(st){t0=st.t0;acc=st.acc;run=st.run}}
const $=id=>document.getElementById(id);

const parseT=v=>{const m=String(v).trim().match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return m[2]===undefined?+m[1]*60:+m[1]*60+ +m[2]};
const N=k=>(E[k]&&E[k].n!==undefined)?E[k].n:D[k].n, T=k=>(E[k]&&E[k].e!==undefined)?E[k].e:D[k].e, dirty=k=>!!E[k];
const say=(m,a)=>{const x=$(a?'alert':'live');x.textContent='';setTimeout(()=>x.textContent=m,50)};

const saveE=()=>LS.set('oof_edits',E);
function setE(k,f,v){const o=D[k][f];E[k]=E[k]||{};if(v===o)delete E[k][f];else E[k][f]=v;if(!Object.keys(E[k]).length)delete E[k];saveE();head()}
const save=()=>{LS.set('oof_tm',{t0,acc,run});LS.set('oof_pg',i)};
const el=()=>acc+(run&&t0?Date.now()-t0:0);
function tick(){const s=i===0?0:el()/1000,late=i>0&&s>T(i),paused=i>0&&!run&&acc>0;$('el').textContent=mmss(s);$('tg').textContent=mmss(T(i));
 $('tm').classList.toggle('late',late);$('tm').classList.toggle('paused',paused);
 $('tm').setAttribute('aria-label',tr('timer',{e:mmss(s),t:mmss(T(i))})+(paused?'. '+tr('paused'):'')+(late?'. '+tr('late'):''));
 if(late&&!wasLate)say(tr('late'),true);wasLate=late}
function head(){$('num').innerHTML=i+(dirty(i)?'<i></i>':'')+'<small>/ '+(D.length-1)+'</small>';$('rv').disabled=!dirty(i)}
function grow(){const t=$('ed');t.style.height='auto';t.style.height=t.scrollHeight+'px';more()}
function show(){i=Math.max(0,Math.min(D.length-1,i));const d=D[i];
 if(d.img){$('img').src=d.img;$('img').alt=tr('slide',{t:d.t});$('img').style.display='block';$('rdy').style.display='none'}else{$('img').style.display='none';$('rdy').style.display='flex';$('rdy').setAttribute('aria-label',tr('ready'))}
 head();$('txt').innerHTML=fmt(N(i));$('ed').value=N(i);$('et').value=mmss(T(i));$('main').scrollTop=0;
 if(i===0){t0=null;acc=0;run=false}else if(!run&&acc===0){t0=Date.now();run=true}
 $('prev').disabled=i===0;$('next').disabled=i===D.length-1;
 wasLate=false;save();tick();say(tr('page',{n:i,m:D.length-1})+(dirty(i)?', '+tr('modified'):''));
 requestAnimationFrame(()=>{edit?grow():more()})}
function size(v){fs=Math.max(14,Math.min(44,v));document.documentElement.style.setProperty('--fs',fs+'px');$('fsv').innerHTML=ic('fs')+'<span>'+fs+'</span>';$('fsv').setAttribute('aria-label',tr('fs')+' '+fs);LS.set('oof_fs',fs);requestAnimationFrame(()=>{edit?grow():more()})}
function setBold(v){bold=v;$('txt').classList.toggle('bold',v);$('ed').classList.toggle('bold',v);$('bd').setAttribute('aria-pressed',v);LS.set('oof_bd',v)}
function setEdit(v){edit=v;document.body.classList.toggle('edit',v);const b=$('edt');b.setAttribute('aria-pressed',v);b.innerHTML=ic(v?'check':'pencil')+'<span>'+esc(tr(v?'doneS':'editS'))+'</span>';b.setAttribute('aria-label',tr(v?'done':'edit'));
 if(!v)$('txt').innerHTML=fmt(N(i));requestAnimationFrame(()=>{v?($('ed').focus(),grow()):more()})}
function mix(a,b,t){const p=h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16));const x=p(a),y=p(b);return '#'+x.map((v,k)=>Math.round(v*t+y[k]*(1-t)).toString(16).padStart(2,'0')).join('')}
function lum(h){const v=[1,3,5].map(k=>{let c=parseInt(h.substr(k,2),16)/255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function paint(){const best=c=>cr(c,'#14161F')>=cr(c,'#F6F4EE')?'#14161F':'#F6F4EE';
 if(col.auto)col.fg=best(col.bg);const r=document.documentElement.style;
 let mu=mix(col.fg,col.bg,.55);const tgt=cr(col.fg,col.bg)>=3.2?col.fg:best(col.bg);
 for(let t=.55;t<=1.001&&cr(mu,col.bg)<3.2;t+=.05)mu=mix(tgt,col.bg,Math.min(t,1));if(cr(mu,col.bg)<3.2)mu=best(col.bg);
 r.setProperty('--bg',col.bg);r.setProperty('--fg',col.fg);r.setProperty('--ac',col.ac);r.setProperty('--mu',mu);r.setProperty('--acfg',best(col.ac));
 r.setProperty('--ui',cr(col.fg,col.bg)>=4.5?col.fg:best(col.bg));r.setProperty('--act',cr(col.ac,col.bg)>=3?col.ac:best(col.bg));
 $('cBg').value=col.bg;$('cFg').value=col.fg;$('cAc').value=col.ac;[['Bg','bg'],['Fg','fg'],['Ac','ac']].forEach(([a,k])=>{$('d'+a).style.background=col[k]});document.querySelector('meta[name=theme-color]').setAttribute('content',col.bg);LS.set('oof_col',col)}
/* label every control: icon + localized text, plus a full accessible name */
const put=(id,icon,txt,aria)=>{const e=$(id);e.innerHTML=(icon?ic(icon):'')+(txt?'<span>'+esc(txt)+'</span>':'');if(aria)e.setAttribute('aria-label',aria);};
put('prev','prev',tr('prev'));$('next').innerHTML='<span>'+esc(tr('next'))+'</span>'+ic('next');
put('gear','gear','',tr('settings'));$('gear').title=tr('settings');
put('dn','minus','',tr('fsDn'));put('up','plus','',tr('fsUp'));

put('exp','share',tr('exp'));put('mback','prev',tr('back'));put('imp','inbox',tr('imp'));put('rst','reset',tr('rst'));
put('ins','tap',tr('ins'),tr('insL'));put('par','paren',tr('par'),tr('parL'));put('rv','undo',tr('rv'),tr('rvL'));put('eDone','check',tr('doneS'),tr('done'));

$('fli').innerHTML=ic('flag')+'<span>'+esc(tr('goal'))+'</span>';$('fli').style.display='flex';$('fli').style.gap='4px';$('fli').style.alignItems='center';

$('sBg').textContent=tr('bgS');$('sFg').textContent=tr('fgS');$('sAc').textContent=tr('acS');

/* export / import — language-neutral headers; older 「第 N 頁」 headers still import */
function exportText(){return D.map((d,k)=>'=== '+k+' | '+mmss(T(k))+' ===\n'+N(k).trim()).join('\n\n')+'\n'}
function importText(txt){const parts=txt.split(/^===\s*(?:第\s*)?(\d+)\s*(?:頁)?\s*(?:[|｜]\s*([0-9:]+))?\s*===\s*$/m);let n=0;
 for(let p=1;p<parts.length;p+=3){const k=+parts[p];if(!(k>=0&&k<D.length))continue;const tt=parts[p+1]?parseT(parts[p+1]):null;setE(k,'n',parts[p+2].replace(/^\n+|\s+$/g,''));if(tt!==null)setE(k,'e',tt);n++}return n}
let lastFocus=null;
function modal(icon,title,desc,text,buttons,ro){lastFocus=document.activeElement;$('mt').innerHTML=ic(icon)+'<span></span>';$('mt').lastChild.textContent=title;$('mp').textContent=desc;const t=$('mtx');t.value=text;t.readOnly=!!ro;t.setAttribute('aria-label',title);
 const b=$('mbtn');b.innerHTML='';buttons.forEach(([icn,k,fn,cls])=>{const x=document.createElement('button');if(cls)x.className=cls;x.innerHTML=ic(icn)+'<span></span>';x.lastChild.textContent=tr(k);x.onclick=fn;b.appendChild(x)});

],true)};
$('imp').onclick=()=>{openP(false);modal('inbox',tr('impT'),tr('impP')+' '+tr('fmtHelp'),'',[
 ['copy','copyPrompt',async()=>{const p=tr('prompt');try{await navigator.clipboard.writeText(p);toast(tr('copied'))}catch(e){const t=$('mtx');t.value=p;t.focus();t.select();toast(tr('selCopy'),'info')}}],
 ['trash','revAll',()=>{E={};saveE();doneM();show();toast(tr('revDone'))}],

$('ed').addEventListener('input',e=>{setE(i,'n',e.target.value);grow()});

function insertAt(pre,post){const t=$('ed'),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;t.value=t.value.slice(0,a)+pre+t.value.slice(a,b)+post+t.value.slice(b);const c=a+pre.length+(b-a);t.focus();t.setSelectionRange(c,c);setE(i,'n',t.value);grow()}
$('ins').onclick=()=>insertAt('【下一步】','');$('par').onclick=()=>insertAt('（','）');

$('more').onclick=e=>{e.stopPropagation();const m=$('main');m.scrollBy({top:m.clientHeight*.7,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
let x0=null,y0=null;const m=$('main');
m.addEventListener('touchstart',e=>{x0=edit?null:e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
m.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){i+=dx<0?1:-1;show()}x0=null});
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('modal').classList.contains('open')){closeM();setTimeout(()=>$('dn').focus(),40)}else if(panel.classList.contains('open')){openP(false);$('gear').focus()}else if(edit)setEdit(false);return}

 if(e.key==='ArrowRight'||e.key==='PageDown'){i++;show()}if(e.key==='ArrowLeft'||e.key==='PageUp'){i--;show()}});
paint();size(fs);setBold(bold);setEdit(false);show();setInterval(tick,250);
}
